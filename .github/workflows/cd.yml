name: CD

on:
  push:
    branches: [main, oto-development]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      AMBIENTE: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      FLAG_PROD: ${{ github.ref_name == 'main' && '--prod' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Baixar configuração do ambiente
        run: vercel pull --yes --environment=$AMBIENTE --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build $FLAG_PROD --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt $FLAG_PROD --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deploy ($AMBIENTE): $url" >> "$GITHUB_STEP_SUMMARY"
